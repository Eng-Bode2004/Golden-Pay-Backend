<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Client Word forms name Windows fonts (Arial, Arabic Transparent, Simplified Arabic, Times New
  Roman, Calibri, Tahoma). Their labels sit in fixed-width text boxes, so only the same letter
  widths keep them in place. The company's own copies of these fonts are installed at startup
  from the private bucket (start.ts) and come first; when one is missing, Latin text uses the
  metric-compatible Liberation/Carlito fonts and Arabic the compact Noto Arabic UI fonts (not
  DejaVu Sans, whose Arabic is much wider than Arial's).
-->
<fontconfig>
  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Arial</family><family>Liberation Sans</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <!-- Windows itself maps Arabic Transparent to Arial (FontSubstitutes). -->
  <alias binding="strong">
    <family>Arabic Transparent</family>
    <prefer><family>Arial</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Tahoma</family>
    <prefer><family>Tahoma</family><family>Liberation Sans</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri</family>
    <prefer><family>Calibri</family><family>Carlito</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Calibri Light</family>
    <prefer><family>Calibri Light</family><family>Calibri</family><family>Carlito</family><family>Noto Sans Arabic UI</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Cambria</family>
    <prefer><family>Cambria</family><family>Caladea</family><family>Noto Naskh Arabic UI</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer><family>Times New Roman</family><family>Liberation Serif</family><family>Noto Naskh Arabic UI</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Simplified Arabic</family>
    <prefer><family>Simplified Arabic</family><family>Noto Naskh Arabic UI</family><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Traditional Arabic</family>
    <prefer><family>Traditional Arabic</family><family>Noto Naskh Arabic UI</family><family>Noto Naskh Arabic</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Hacen Liner Print-out</family>
    <prefer><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <!-- Glyph fallback for Arabic after a Latin-only stand-in (Liberation, Carlito). -->
  <alias binding="strong">
    <family>Liberation Sans</family>
    <prefer><family>Liberation Sans</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Carlito</family>
    <prefer><family>Carlito</family><family>Noto Sans Arabic UI</family><family>Noto Sans Arabic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Liberation Serif</family>
    <prefer><family>Liberation Serif</family><family>Noto Naskh Arabic UI</family><family>Noto Naskh Arabic</family></prefer>
  </alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Arabic UI</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ar</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Naskh Arabic UI</string></edit>
  </match>
</fontconfig>
